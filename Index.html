<script>
    // CONFIGURACIÓN DE FIREBASE (Reemplaza con tus credenciales)
    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "TU_PROJECT_ID.firebaseapp.com",
        projectId: "TU_PROJECT_ID",
        storageBucket: "TU_PROJECT_ID.appspot.com",
        messagingSenderId: "TU_SENDER_ID",
        appId: "TU_APP_ID"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // VARIABLES GLOBALES
    let globalBooks = [];
    let pendingBookData = null;

    // INICIALIZACIÓN DE ESCUCHADORES FIRESTORE
    document.addEventListener("DOMContentLoaded", () => {
        // Escuchar libros
        db.collection("libros").onSnapshot(snapshot => {
            globalBooks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            renderBooks();
            populateBooksDatalist();
        });

        // Configurar fecha por defecto en préstamos
        setPresetDays(10);
    });

    // CAMBIO DE PESTAÑAS (TABS)
    function showTab(tabId, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        btn.classList.add('active');
    }

    // MODALES
    function closeModal(modalId) {
        document.getElementById(modalId).style.display = 'none';
    }

    // LISTA DESPLEGABLE EN PRÉSTAMOS
    function populateBooksDatalist() {
        const datalist = document.getElementById("booksList");
        if (!datalist) return;
        datalist.innerHTML = "";
        globalBooks.forEach(b => {
            const option = document.createElement("option");
            option.value = b.title;
            option.label = `[${b.sede}] ${b.title} - ISBN: ${b.isbn} (Disponibles: ${b.copies})`;
            datalist.appendChild(option);
        });
    }

    // -------------------------------------------------------------
    // LÓGICA DE AGREGAR LIBROS Y DETECCIÓN DE SEMEJANTES / DUPLICADOS
    // -------------------------------------------------------------
    function addBook(event) {
        event.preventDefault();

        const title = document.getElementById("title").value.trim();
        const author = document.getElementById("author").value.trim();
        const category = document.getElementById("category").value;
        const description = document.getElementById("description").value.trim();
        const isbn = document.getElementById("isbn").value.trim();
        const editorial = document.getElementById("editorial").value.trim();
        const year = parseInt(document.getElementById("year").value) || new Date().getFullYear();
        const copies = parseInt(document.getElementById("copies").value) || 1;
        const sede = document.getElementById("sede").value;

        // Estructura del libro a agregar
        pendingBookData = {
            title,
            author,
            category,
            description,
            isbn,
            editorial,
            year,
            copies,
            borrowed: 0,
            sede,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        // Buscar coincidencia exacta por ISBN o coincidencia semejante por Título
        const cleanTitle = title.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        
        const matches = globalBooks.filter(book => {
            const sameIsbn = isbn !== "" && book.isbn && book.isbn.trim().toLowerCase() === isbn.toLowerCase();
            const bookTitleClean = (book.title || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
            const sameOrSimilarTitle = bookTitleClean.includes(cleanTitle) || cleanTitle.includes(bookTitleClean);
            
            return sameIsbn || sameOrSimilarTitle;
        });

        if (matches.length > 0) {
            // Mostrar modal con semejantes
            showDuplicateModal(matches, copies);
        } else {
            // No hay duplicados/semejantes -> guardar directamente
            saveNewBook(pendingBookData);
        }
    }

    // MOSTRAR MODAL CON COINCIDENCIAS
    function showDuplicateModal(matches, newCopies) {
        const container = document.getElementById("duplicateListContainer");
        container.innerHTML = "";

        matches.forEach(book => {
            const div = document.createElement("div");
            div.style.cssText = "padding: 10px; margin-bottom: 8px; border-bottom: 1px solid #D8C3A5; display: flex; justify-content: space-between; align-items: center;";
            
            div.innerHTML = `
                <div>
                    <strong>📖 ${book.title}</strong> (${book.author})<br>
                    <small>🏛️ ${book.sede} | 🏷️ ${book.category} | ISBN: ${book.isbn || 'N/A'}</small><br>
                    <small>Disponibles actuales: <strong>${book.copies}</strong> | Prestados: <strong>${book.borrowed || 0}</strong></small>
                </div>
                <button type="button" class="btn" style="padding: 6px 12px; font-size: 0.82rem; background-color: var(--success-laurel); color: white; border: none;" onclick="addUnitsToExistingBook('${book.id}', ${newCopies}, '${book.title.replace(/'/g, "\\'")}')">
                    ➕ Sí, sumar +${newCopies} unidad(es)
                </button>
            `;
            container.appendChild(div);
        });

        document.getElementById("duplicateModal").style.display = "block";
    }

    // OPCIÓN A: SUMAR UNIDADES A UN REGISTRO EXISTENTE
    async function addUnitsToExistingBook(bookId, extraCopies, bookTitle) {
        try {
            const bookRef = db.collection("libros").doc(bookId);
            await bookRef.update({
                copies: firebase.firestore.FieldValue.increment(extraCopies)
            });

            alert(`✅ Se han sumado exitosamente ${extraCopies} unidad(es) al libro "${bookTitle}".`);
            document.getElementById("bookForm").reset();
            closeModal("duplicateModal");
        } catch (error) {
            console.error("Error al actualizar las unidades:", error);
            alert("❌ Ocurrió un error al actualizar el inventario.");
        }
    }

    // OPCIÓN B: REGISTRAR COMO UN NUEVO LIBRO INDEPENDIENTE
    async function confirmAddAsNewBook() {
        if (pendingBookData) {
            await saveNewBook(pendingBookData);
            closeModal("duplicateModal");
        }
    }

    // GUARDAR NUEVO LIBRO EN FIRESTORE
    async function saveNewBook(data) {
        try {
            await db.collection("libros").add(data);
            alert("✅ Libro guardado exitosamente en el inventario.");
            document.getElementById("bookForm").reset();
            pendingBookData = null;
        } catch (error) {
            console.error("Error al agregar libro:", error);
            alert("❌ Ocurrió un error al guardar el libro en el inventario.");
        }
    }

    // -------------------------------------------------------------
    // RENDERIZADO DE TABLA DE LIBROS E INVENTARIO
    // -------------------------------------------------------------
    function renderBooks() {
        const tbody = document.querySelector("#booksTable tbody");
        if (!tbody) return;

        const search = document.getElementById("searchBook").value.toLowerCase();
        const categoryFilter = document.getElementById("filterCategoryBook").value;
        const sedeFilter = document.getElementById("filterSedeBook").value;

        tbody.innerHTML = "";

        const filtered = globalBooks.filter(b => {
            const matchesText = (b.title || '').toLowerCase().includes(search) ||
                                (b.author || '').toLowerCase().includes(search) ||
                                (b.isbn || '').toLowerCase().includes(search) ||
                                (b.description || '').toLowerCase().includes(search);
            const matchesCategory = categoryFilter === "" || b.category === categoryFilter;
            const matchesSede = sedeFilter === "" || b.sede === sedeFilter;

            return matchesText && matchesCategory && matchesSede;
        });

        filtered.forEach(b => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td><span class="badge-sede">${b.sede || 'N/A'}</span></td>
                <td><strong>${b.title}</strong></td>
                <td>${b.author}</td>
                <td><span class="badge-category">${b.category || 'General'}</span></td>
                <td><div class="text-desc" title="${b.description || ''}">${b.description || 'Sin descripción'}</div></td>
                <td>${b.isbn || '-'}</td>
                <td>${b.editorial || '-'} (${b.year || '-'})</td>
                <td><span class="${b.copies > 0 ? 'badge-available' : 'badge-unavailable'}">${b.copies}</span></td>
                <td>${b.borrowed || 0}</td>
                <td>
                    <button class="btn-edit" onclick="openEditBookModal('${b.id}')">✏️ Editar</button>
                    <button class="btn-delete" onclick="deleteBook('${b.id}')">🗑️ Eliminar</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // ELIMINAR LIBRO
    async function deleteBook(id) {
        if (confirm("¿Está seguro de eliminar este libro del inventario?")) {
            try {
                await db.collection("libros").doc(id).delete();
                alert("🗑️ Libro eliminado del inventario.");
            } catch (err) {
                console.error(err);
                alert("Ocurrió un error al eliminar.");
            }
        }
    }

    // EDITAR LIBRO
    function openEditBookModal(id) {
        const book = globalBooks.find(b => b.id === id);
        if (!book) return;

        document.getElementById("editBookId").value = book.id;
        document.getElementById("editSede").value = book.sede || "Sede Conrado (Atenea)";
        document.getElementById("editTitle").value = book.title || "";
        document.getElementById("editAuthor").value = book.author || "";
        document.getElementById("editCategory").value = book.category || "General / Otras";
        document.getElementById("editDescription").value = book.description || "";
        document.getElementById("editIsbn").value = book.isbn || "";
        document.getElementById("editEditorial").value = book.editorial || "";
        document.getElementById("editYear").value = book.year || "";
        document.getElementById("editCopies").value = book.copies || 0;
        document.getElementById("editBorrowed").value = book.borrowed || 0;

        document.getElementById("editBookModal").style.display = "block";
    }

    async function saveEditBook(e) {
        e.preventDefault();
        const id = document.getElementById("editBookId").value;

        const updatedData = {
            sede: document.getElementById("editSede").value,
            title: document.getElementById("editTitle").value.trim(),
            author: document.getElementById("editAuthor").value.trim(),
            category: document.getElementById("editCategory").value,
            description: document.getElementById("editDescription").value.trim(),
            isbn: document.getElementById("editIsbn").value.trim(),
            editorial: document.getElementById("editEditorial").value.trim(),
            year: parseInt(document.getElementById("editYear").value) || 0,
            copies: parseInt(document.getElementById("editCopies").value) || 0,
            borrowed: parseInt(document.getElementById("editBorrowed").value) || 0
        };

        try {
            await db.collection("libros").doc(id).update(updatedData);
            alert("✅ Libro actualizado correctamente.");
            closeModal("editBookModal");
        } catch (err) {
            console.error(err);
            alert("❌ Error al actualizar el libro.");
        }
    }

    // UTILIDAD FECHAS
    function setPresetDays(days) {
        const dateInput = document.getElementById("dueDate");
        if (!dateInput) return;
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + days);
        dateInput.value = targetDate.toISOString().split("T")[0];
    }
</script>
</body>
</html>
